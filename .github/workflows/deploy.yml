name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências JS e build
        run: npm ci && npm run build

      - name: Pré-cache de rotas
        run: |
          cp .env.example .env
          php artisan key:generate --quiet
          php artisan route:cache

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            .env.example
            instrucao-laravel-demandas.md
            database/database.sqlite
