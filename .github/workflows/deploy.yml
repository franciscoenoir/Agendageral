name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Instalar dependências PHP (apenas para route:cache)
        run: composer install --no-interaction --prefer-dist --no-dev --ignore-platform-reqs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependências npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Instalar dependências JS e build
        run: npm ci && npm run build

      - name: Pré-cache de rotas
        run: |
          cp .env.example .env
          php artisan key:generate --quiet
          php artisan route:cache

      - name: Instalar sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via rsync (SSH com senha)
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e rsync -azP --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='database/database.sqlite' \
            --exclude='instrucao-laravel-demandas.md' \
            . ${{ secrets.SSH_USER }}@${{ secrets.SSH_IP }}:~/agenda

      - name: Executar composer, migrations e cache pós-deploy (via SSH)
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_IP }} \
            "cd ~/agenda && \
             composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev && \
             php artisan migrate --force && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache && \
             php artisan optimize"
