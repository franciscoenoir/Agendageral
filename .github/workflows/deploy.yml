name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Instalar dependências PHP (produção)
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependências npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Instalar dependências JS e build
        run: npm ci && npm run build

      - name: Instalar sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via rsync (SSH com senha)
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e rsync -azP --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --include='public/build/***' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='database/database.sqlite' \
            --exclude='instrucao-laravel-demandas.md' \
            . ${{ secrets.SSH_USER }}@${{ secrets.SSH_IP }}:~/domains/premiered.com.br/public_html/agenda

      - name: Migrations e cache pós-deploy (via SSH)
        env:
          SSHPASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -e ssh -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_IP }} \
            "cd ~/domains/premiered.com.br/public_html/agenda && \
             mkdir -p database && touch database/database.sqlite && \
             php artisan migrate --force && \
             php artisan config:cache && \
             php artisan route:cache"