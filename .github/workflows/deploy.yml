name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Cache dependências Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependências npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Instalar dependências JS e build
        run: npm ci && npm run build

      - name: Pré-cache de rotas
        run: |
          cp .env.example .env
          php artisan key:generate --quiet
          php artisan route:cache

      - name: Cache estado FTP (sync state)
        uses: actions/cache@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-${{ github.ref_name }}
          restore-keys: ftp-sync-

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}
          security: loose
          timeout: 0
          retry-count: 25
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/vendor/*/tests/**
            **/vendor/*/test/**
            **/vendor/*/docs/**
            **/vendor/*/doc/**
            **/vendor/*/*.md
            .env
            .env.example
            instrucao-laravel-demandas.md
            database/database.sqlite

      - name: Executar migrations e cache pós-deploy
        run: |
          curl --fail --silent --show-error \
            --max-time 60 \
            -X POST "${{ secrets.APP_URL }}/deploy/run" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            | tee /dev/stderr | grep -q '"status":"ok"'
