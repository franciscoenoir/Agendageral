name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build e deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Instalar dependências PHP (apenas para route:cache)
        run: composer install --no-interaction --prefer-dist --no-dev --ignore-platform-reqs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependências npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Instalar dependências JS e build
        run: npm ci && npm run build

      - name: Pré-cache de rotas
        run: |
          cp .env.example .env
          php artisan key:generate --quiet
          php artisan route:cache

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTPS porta 990
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          lftp -c "
            set ssl:verify-certificate no;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set net:max-retries 10;
            set net:timeout 30;
            set mirror:parallel-transfer-count 5;
            open ftps://'$FTP_USER':'$FTP_PASS'@'$FTP_HOST':990;
            mirror --reverse --delete --verbose=1 \
              --exclude-glob .git/ \
              --exclude-glob node_modules/ \
              --exclude-glob vendor/ \
              --exclude-glob tests/ \
              --exclude-glob .env \
              --exclude-glob .env.example \
              --exclude-glob database/database.sqlite \
              --exclude-glob instrucao-laravel-demandas.md \
              . '$FTP_PATH';
            bye
          "

      - name: Executar composer, migrations e cache pós-deploy
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            -X POST "${{ secrets.APP_URL }}/deploy/run" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            | tee /dev/stderr | grep -q '"status":"ok"'
